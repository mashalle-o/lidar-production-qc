[project]
name = "lidarqc"
version = "0.1.0"
description = "USGS 3DEP lidar production QC and spec-conformance pipeline"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lidarqc"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the full dataset; deselect with -m 'not slow'"]
